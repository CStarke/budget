<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Background (Circle) -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.18" />
  
  <!-- Stock Trend Arrow: Up & Right -> Down Once -> Up & Right -->
  <g filter="url(#shadow)">
    <!-- Main Trend Zig-zag Line -->
    <polyline points="135,345 220,245 280,295 375,175" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead at Top-Right -->
    <polyline points="305,175 375,175 375,245" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
