<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />
  
  <!-- Central Icon: Modern Minimalist Wallet + Spark -->
  <g filter="url(#shadow)" transform="translate(106, 126)">
    <!-- Wallet Body -->
    <rect x="0" y="40" width="300" height="200" rx="36" fill="url(#glyphGrad)" />
    <!-- Wallet Flap / Accent -->
    <path d="M 0 80 Q 150 120 300 80 L 300 40 Q 150 40 0 40 Z" fill="#cbd5e1" opacity="0.4" />
    <!-- Currency Token / Clasp -->
    <circle cx="230" cy="140" r="28" fill="#10b981" />
    <circle cx="230" cy="140" r="16" fill="#ffffff" />
    <!-- Rising Spark / Arrow (representing smart budgeting) -->
    <path d="M 60 170 L 110 120 L 140 150 L 190 100" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="165,100 190,100 190,125" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
