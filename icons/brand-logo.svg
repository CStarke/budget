<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Invisible circular mask that slices the bottom-left tail -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="250" />
    </clipPath>
  </defs>

  <!-- Scaled-Up Stocks Trend Arrow (cut off in the bottom-left by invisible circle) -->
  <g clip-path="url(#circleClip)">
    <!-- Main Trend Line: bottom-left cut off -> peak -> dip -> surge -->
    <polyline points="20,440 190,220 270,290 430,110" fill="none" stroke="#10b981" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead at Top-Right -->
    <polyline points="330,110 430,110 430,210" fill="none" stroke="#10b981" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
