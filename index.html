<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Budget</title>
  
  <!-- Web App Manifest & Android/Firefox Config -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  
  <!-- Monospace Font: Roboto Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon.svg" alt="Budget Icon" class="brand-icon">
        <div>
          <h1 class="brand-title">Budget</h1>
          <div class="brand-status" id="brandStatus">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Checking connection...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnOpenSettings" aria-label="Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Entry Form -->
    <main class="entry-form" id="entryForm">
      <!-- Amount Hero Input -->
      <div class="amount-card">
        <div class="amount-label">Dollar Amount</div>
        <div class="amount-input-container">
          <span class="currency-symbol">$</span>
          <input 
            type="text" 
            id="amountInput" 
            class="amount-input" 
            placeholder="0.00" 
            inputmode="numeric" 
            autocomplete="off"
            autofocus
          >
        </div>
      </div>

      <!-- Date Section -->
      <section class="form-section">
        <div class="section-label">
          <span>Date</span>
          <span class="label-hint" id="dateDisplay">Today</span>
        </div>
        <div class="date-row">
          <button type="button" class="date-pill active" id="btnDateToday">Today</button>
          <button type="button" class="date-pill" id="btnDateYesterday">Yesterday</button>
          <button type="button" class="date-pill" id="btnDateCustom">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span id="customDateLabel">Custom</span>
          </button>
          <input type="date" id="datePicker" class="hidden-date-input">
        </div>
      </section>

      <!-- Description Section -->
      <section class="form-section">
        <div class="section-label">
          <span>Description</span>
        </div>
        <input 
          type="text" 
          id="descInput" 
          class="text-input" 
          placeholder="e.g. Lunch with team, Gas, Groceries"
          autocomplete="off"
          autocapitalize="sentences"
          autocorrect="on"
          spellcheck="true"
        >
      </section>

      <!-- Category, From, To Horizontal Row (Shaped like Date Buttons) -->
      <section class="form-section">
        <div class="category-grid">
          <div class="category-col">
            <div class="category-label">Category</div>
            <button type="button" class="date-pill selector-pill" id="btnSelectCategory">
              <span class="pill-text placeholder" id="catBtnText">Select one</span>
            </button>
          </div>
          <div class="category-col">
            <div class="category-label">From</div>
            <button type="button" class="date-pill selector-pill" id="btnSelectFrom">
              <span class="pill-text placeholder" id="fromBtnText">Select one</span>
            </button>
          </div>
          <div class="category-col">
            <div class="category-label">To</div>
            <button type="button" class="date-pill selector-pill" id="btnSelectTo">
              <span class="pill-text placeholder" id="toBtnText">Select one</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Submit Button -->
      <div class="submit-container">
        <button type="button" class="btn-submit" id="btnSubmit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span id="btnSubmitText">Add Transaction</span>
        </button>
      </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
      <span id="toastIcon"></span>
      <span id="toastMessage"></span>
    </div>

    <!-- Centered Dark-to-Transparent Radial Overlay for Chip Selection -->
    <div class="picker-overlay" id="pickerOverlay" aria-hidden="true">
      <div class="picker-backdrop" id="pickerBackdrop"></div>
      <div class="picker-container">
        <div class="picker-list" id="pickerList">
          <!-- Centered vertical list of options -->
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-sheet">
        <div class="modal-header">
          <h2 class="modal-title">Settings</h2>
          <button class="btn-close" id="btnCloseSettings">&times;</button>
        </div>

        <div class="settings-field">
          <label class="settings-label" for="scriptUrlInput">Google Apps Script Web App URL</label>
          <input 
            type="url" 
            id="scriptUrlInput" 
            class="settings-input" 
            placeholder="https://script.google.com/macros/s/.../exec"
          >
          <p class="settings-tip">
            In your Google Sheet, go to <b>Extensions &gt; Apps Script</b>, paste the script code, click <b>Deploy &gt; New deployment &gt; Web app</b>, and paste the URL.
          </p>
        </div>

        <button type="button" class="btn-save-settings" id="btnSaveSettings">Save &amp; Connect</button>
        <button type="button" class="btn-sync-now" id="btnSyncNow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Sync Dropdown Chips Now
        </button>
        <button type="button" class="btn-sync-now" id="btnUpdateApp" style="margin-top: 10px; border-color: rgba(59, 130, 246, 0.4); color: #93c5fd;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          Force App Refresh / Update
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
